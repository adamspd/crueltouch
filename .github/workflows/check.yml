# The project has no tests yet. This installs the requirements and starts
# Django (system checks, migrations), which catches most broken updates.
name: Check

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # No .env in CI: settings use their defaults (SQLite, no email).
    env:
      SECRET_KEY_VALUE: ci-only-not-a-real-secret-key
      LIST_OF_ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Same as the Dockerfile.
          python-version: '3.14'
          cache: 'pip'

      # For building PDF packages (xhtml2pdf) if no wheel exists.
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Migrations
        run: |
          python manage.py makemigrations
          python manage.py migrate

  # Merge Dependabot patch and minor updates once the check passes.
  # Major updates stay open for a manual review.
  automerge:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
